name: Update playlists

on:
  schedule:
    # 02:23 UTC = 07:23 Pakistan time.
    # Deliberately off the hour: GitHub drops runs scheduled at :00 when
    # Actions is under load, which is every hour boundary.
    - cron: "23 2 * * *"
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:                  # only re-run on real changes, not doc edits
      - "scripts/**"
      - "config.json"
      - ".github/workflows/**"

permissions:
  contents: write           # needed to commit the refreshed playlists

concurrency:                # never let two runs fight over the same commit
  group: update-playlists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. Rebuild sources from the iptv-org API.
      #    New channels added upstream get picked up here automatically.
      - name: Build playlists
        run: python scripts/build.py --config config.json --outdir build

      # 2. Test every stream, drop the dead ones, collapse duplicates.
      - name: Verify streams
        run: |
          python scripts/verify.py \
            --config config.json \
            --indir build \
            --outdir docs \
            --reportdir reports \
            --workers 20 \
            --timeout 12 \
            --retries 2

      # 3. Merge into a single all.m3u with one folder per category, for
      #    players that support group-title (TiviMate, Smarters, VLC, Kodi).
      - name: Build combined playlist
        run: python scripts/combine.py --indir docs --out docs/all.m3u

      # 4. Build the SS IPTV folder menu - one link, seven folder tiles.
      - name: Build SS IPTV menu playlist
        run: |
          python scripts/menu.py \
            --base "https://raw.githubusercontent.com/${{ github.repository }}/main/docs" \
            --out docs/menu.m3u

      # 5. Rebuild the landing page from the fresh status data.
      - name: Build index page
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/make_index.py

      - name: Disable Jekyll on Pages
        run: touch docs/.nojekyll

      - name: Show summary in the run log
        run: cat STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs reports STATUS.md
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi

          # Stream testing takes ~10 minutes. Someone may have pushed to main
          # in the meantime, which makes our push a non-fast-forward and it
          # gets rejected. Everything under docs/ and reports/ is regenerated
          # from scratch each run, so there is nothing to merge: rebase our
          # index onto the newest origin/main and commit again. The working
          # tree is left untouched by --mixed, so our fresh files survive.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --mixed origin/main
            git add docs reports STATUS.md

            if git diff --staged --quiet; then
              echo "nothing changed relative to origin/main"
              exit 0
            fi

            git commit --quiet -m "Update playlists $(date -u '+%Y-%m-%d %H:%M UTC')"

            if git push --quiet origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi

            echo "push rejected on attempt $attempt, retrying"
            sleep $((attempt * 5))
          done

          echo "could not push after 5 attempts"
          exit 1

      # Keeps the daily schedule alive. GitHub disables cron on public repos
      # after 60 days without repository activity.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: echo "scheduled run completed $(date -u)"
